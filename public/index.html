<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Researcher</title>
<style>
  :root { --bg:#f7f7f8; --card:#fff; --ink:#1a1d23; --muted:#6b7280; --accent:#2f45c6; --rule:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --card:#171b23; --ink:#e7ebf2; --muted:#9aa3b5; --accent:#93a3ff; --rule:#2a3140; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:860px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.6rem; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 24px; }
  form { display:flex; gap:8px; } input { flex:1; padding:12px; border:1px solid var(--rule); border-radius:8px; background:var(--card); color:var(--ink); }
  button { padding:12px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #log { margin-top:24px; background:var(--card); border:1px solid var(--rule); border-radius:8px; padding:16px; min-height:160px; font:13px/1.5 ui-monospace, monospace; white-space:pre-wrap; }
  .ev { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Multi-Agent Deep Researcher</h1>
  <p class="sub">Planner → parallel retrievers → critical analysis → insights → red-team → report. Streams agent events live.</p>
  <form id="f">
    <input id="q" placeholder="Ask a hard, multi-source question…" required minlength="5">
    <button id="go">Research</button>
  </form>
  <div id="log">Ready. Health: <span id="health">checking…</span></div>
</main>
<script>
  const log = document.getElementById('log');
  fetch('/api/health').then(r => r.json()).then(h => {
    document.getElementById('health').textContent = `ok · graph_wired=${h.graph_wired} · max_hops=${h.max_hops}`;
  }).catch(() => document.getElementById('health').textContent = 'unreachable');

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('go'); btn.disabled = true;
    log.textContent = '';
    const res = await fetch('/api/research', {
      method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({ question: document.getElementById('q').value })
    });
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(chunk)?.[1] ?? 'message';
        const data = /^data: (.*)$/m.exec(chunk)?.[1] ?? '';
        const el = document.createElement('div');
        el.innerHTML = `<span class="ev">[${ev}]</span> ${data}`;
        log.appendChild(el);
      }
    }
    btn.disabled = false;
  });
</script>
</body>
</html>
