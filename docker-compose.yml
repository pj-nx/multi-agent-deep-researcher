# Local stand-in for the hosted deployment: the API container + Postgres checkpoints + a Chroma server.
#   cp .env.example .env   # set OPENROUTER_API_KEY, API_AUTH_TOKEN
#   docker compose up --build
#   open http://localhost:8000/public/index.html (or curl /api/health)
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      CHECKPOINTER: postgres
      DATABASE_URL: postgresql://dr:dr@postgres:5432/dr
      CHROMA_MODE: http
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      EMBEDDINGS_PROVIDER: openrouter
      TRUST_PROXY_HEADERS: "false"
    depends_on:
      postgres: { condition: service_healthy }
      chroma: { condition: service_started }
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: dr, POSTGRES_PASSWORD: dr, POSTGRES_DB: dr }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dr"], interval: 5s, timeout: 3s, retries: 10 }
  chroma:
    image: chromadb/chroma:1.5.9
    volumes: ["chromadata:/data"]
    environment: { IS_PERSISTENT: "TRUE", PERSIST_DIRECTORY: /data, ANONYMIZED_TELEMETRY: "FALSE" }
volumes:
  pgdata: {}
  chromadata: {}
