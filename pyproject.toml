[project]
name = "deep-researcher"
version = "0.1.0"
description = "Multi-agent AI deep researcher: planner, retrievers, critical analysis, insight generation, red-team critic, report builder (LangGraph)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117.1",
    "pydantic>=2.9",
    "langsmith>=0.3",
    "langchain-core>=1.0",
    "httpx>=0.28",
    "tiktoken>=0.7",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "aiosqlite>=0.22.1",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "langchain-openai>=1.7.0",
    "langdetect>=1.0.9",
    "markdown>=3.11",
    "xhtml2pdf>=0.2.23",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.2",
    "chromadb>=1.0",
]

[project.optional-dependencies]
# Added as the phases in PLAN.md land.
agents = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=1.0",
    "langchain-community>=0.3",
    "tavily-python>=0.5",
    "arxiv>=2.1",
    "semanticscholar>=0.9",
    "wikipedia>=1.4",
    "pypdf>=5.4",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]
ui = ["gradio>=5.22"]
# Persistent vector DB (embedded Chroma; same client talks to Chroma server/cloud).
vectordb = ["chromadb>=1.0"]
# Pick ONE embeddings backend. `local` needs no API key and no server.
embeddings-local = ["langchain-huggingface>=0.3", "sentence-transformers>=3.0"]
# Extra deps google/embeddinggemma-2 needs even for text-only use (its processor is multimodal).
embeddings-gemma = ["pillow>=10", "torchvision>=0.20"]
embeddings-ollama = ["langchain-ollama>=0.3"]
# DOCX parsing for uploaded documents (PDF, TXT, MD and HTML need nothing extra).
documents = ["python-docx>=1.1"]
embeddings-openai = ["langchain-openai>=1.0"]
dev = ["pytest>=8", "anyio>=4", "httpx>=0.28", "uvicorn>=0.30", "ruff>=0.6", "chromadb>=1.0"]

# CPU-only PyTorch for the local embedding model (the default PyPI wheel drags in CUDA libraries).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_researcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "RUF", "SLF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"api/index.py" = ["E402"]   # sys.path shim must precede imports on Vercel
"tests/*" = ["SLF001", "E501", "E402"]
"src/deep_researcher/api_guide.py" = ["E501"]   # Markdown prose and table rows
